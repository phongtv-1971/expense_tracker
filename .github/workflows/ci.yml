name: CI

on:
  push:
    branches: [ master, main, '001-personal-expense' ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install
        run: |
          cd web
          pnpm install --frozen-lockfile || npm install
      - name: Lint
        run: |
          cd web
          pnpm lint || npm run lint
      - name: Unit tests
        run: |
          cd web
          pnpm test || npm run test
